server:
  port: 8080

spring:
  application:
    name: geofencing

  datasource:
    url: jdbc:postgresql://postgres:5432/pesco_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: redis
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: geofencing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.geofence.*"

  websocket:
    allowed-origins: "*"

grpc:
  server:
    port: 9090
    max-inbound-message-size: 10MB

jwt:
  secret: MLSD72dMlUyRppxbAMZdZMqVtoDOiPHX7GFMdjvNUli28IQT9UM0pLFHv6YaeJstLZeQWAE94hLuNeN5pjmUxFczwAKTg1QiluG4lh
  expiration: 86400000
  refresh-expiration: 604800000

geofencing:
  location:
    update-interval-ms: 1000
    history-ttl-hours: 24
    max-history-per-user: 1000
  cache:
    user-ttl-seconds: 300
    geofence-ttl-seconds: 600
    location-ttl-seconds: 30
  kafka:
    topics:
      location-updates: geofencing.location.updates
      geofence-events: geofencing.geofence.events
      alerts: geofencing.alerts

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.geofence: DEBUG
    io.grpc: INFO
    org.springframework.kafka: INFO