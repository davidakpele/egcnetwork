spring:
  application:
    name: geofencing

  datasource:
      url: jdbc:postgresql://localhost:5432/geofencing_db
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
 
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
 
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
 
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: geofencing-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.geofence.*"
    listener:
      concurrency: 3
      ack-mode: manual_immediate
 
  websocket:
    allowed-origins: "*"
 
grpc:
  server:
    port: 9090
    security:
      enabled: false
 
server:
  port: 8080
  servlet:
    context-path: /api
 
jwt:
  secret: ${JWT_SECRET:c29tZXZlcnlsb25nc2VjcmV0a2V5Zm9yamVvZmVuY2luZ3NlcnZpY2UyMDI0}
  expiration-ms: 86400000        # 24h
  refresh-expiration-ms: 604800000 # 7d
 
geofencing:
  location:
    history-ttl-days: 30
    cache-ttl-seconds: 300
    max-history-points: 10000
  geofence:
    max-per-user: 100
    max-polygon-points: 100
    default-dwell-time-ms: 60000
  alerts:
    max-per-geofence-per-day: 100
    webhook-timeout-ms: 5000
  nearby:
    default-radius-km: 5.0
    max-radius-km: 50.0
 
kafka:
  topics:
    location-update: location.updates
    geofence-event: geofence.events
    alert-notification: alert.notifications
    user-tracking: user.tracking
 
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
 
logging:
  level:
    com.geofence: DEBUG
    org.springframework.kafka: INFO
    io.grpc: INFO
 